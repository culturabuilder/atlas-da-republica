# Área "Do zero": o governo federal para quem nunca estudou o assunto.
# Anterior a data/como-funciona.yaml, que é mais avançada. Sem opinião política.
# Frases curtas, voz ativa, comparações do dia a dia. Números redondos, com o ano.
titulo: Do zero
subtitulo: O governo brasileiro explicado em palavras simples, desde o começo.
intro: Esta área explica como o governo federal funciona, desde o começo. É para quem nunca estudou isso
  e quer entender sem pressa.
capitulos:
- id: o-que-e-governo
  pergunta: O que é o governo?
  resposta_curta: Governo é o conjunto de órgãos que cria regras e mantém serviços públicos.
  texto: O governo federal cuida do país inteiro. Ele cobra impostos, paga servidores e entrega serviços.
    Hospitais do SUS, escolas federais e estradas saem daí. Quem trabalha nele é servidor público, pago
    com dinheiro de todos. Existem também governos estaduais e municipais, com outras tarefas.
  analogia: Pense num prédio grande, com síndico, funcionários e regras. Cada morador paga a taxa e pode
    cobrar o serviço.
  no_atlas: O Atlas mostra mais de 1.300 órgãos e cargos do governo federal.
  link: br-eleitorado
  palavras:
  - termo: União
    e: O governo federal brasileiro, responsável pelo país inteiro.
  - termo: servidor público
    e: Pessoa que trabalha para um órgão público, paga com impostos.
- id: tres-poderes
  pergunta: Por que existem três poderes?
  resposta_curta: Para que ninguém decida tudo sozinho, o poder foi dividido em três partes.
  texto: 'O Legislativo escreve as leis. O Executivo governa: arrecada dinheiro, gasta e presta serviços.
    O Judiciário julga conflitos e diz o que a lei significa. A Constituição chama os três de independentes
    e harmônicos. Cada um pode conferir o trabalho do outro.'
  analogia: Numa escola, quem escreve o regulamento não é quem aplica a punição. Assim, uma decisão importante
    passa por mais de uma cabeça.
  no_atlas: A roda do Atlas separa os órgãos por poder, em setores diferentes.
  link: /como-funciona/
  palavras:
  - termo: Constituição
    e: A lei principal do país; todas as outras precisam obedecê-la.
  - termo: poder
    e: 'Cada uma das três partes do Estado: Legislativo, Executivo e Judiciário.'
- id: o-que-faz-o-presidente
  pergunta: O que o presidente faz?
  resposta_curta: O presidente chefia o Executivo, escolhe ministros e sanciona ou veta as leis.
  texto: 'O povo elege o presidente e o vice na mesma votação. O mandato dura quatro anos e começa em
    1º de janeiro. A mesma pessoa pode ser reeleita uma única vez seguida. O presidente assina decretos,
    que detalham como cumprir uma lei. Ele comanda as Forças Armadas e representa o Brasil no exterior.
    Ele não pode criar imposto sozinho: isso depende de lei.'
  analogia: É parecido com o diretor de uma escola grande. Ele manda no dia a dia, mas obedece ao regulamento.
  no_atlas: A página do presidente mostra quem ele nomeia e desde quando.
  link: br-presidente-da-republica
  palavras:
  - termo: decreto
    e: Ato do presidente que explica como aplicar uma lei.
  - termo: mandato
    e: Tempo certo que alguém pode ocupar um cargo.
- id: ministro-e-ministerio
  pergunta: O que faz um ministro?
  resposta_curta: O ministro dirige um ministério, a parte do governo responsável por um assunto.
  texto: 'Cada ministério cuida de um tema: saúde, educação, transporte. O ministro dá ordens dentro do
    ministério e responde ao presidente. O presidente escolhe e troca ministros quando quiser. A Constituição
    pede ser brasileiro e ter mais de 21 anos. Hoje existem mais de 30 ministérios no governo federal.
    Dentro de cada um há secretarias, com equipes menores.'
  analogia: Um ministério é como um setor de uma empresa grande. O ministro é o chefe daquele setor.
  no_atlas: Cada ministério tem página com seu ministro, suas secretarias e seus gastos.
  link: br-ministerio-da-educacao
  palavras:
  - termo: ministério
    e: Órgão do Executivo responsável por uma área, como saúde ou educação.
  - termo: exonerar
    e: Tirar alguém de um cargo público.
- id: quem-escreve-as-leis
  pergunta: Quem escreve as leis?
  resposta_curta: O Congresso Nacional escreve e aprova as leis federais do país.
  texto: O Congresso Nacional tem duas casas. A Câmara dos Deputados reúne 513 deputados federais. O Senado
    Federal reúne 81 senadores, três por estado. Um projeto pode vir de parlamentares, do presidente ou
    de tribunais. O povo também pode propor, com assinaturas de 1% dos eleitores. Ministérios ajudam a
    escrever textos, mas só o Congresso aprova leis.
  analogia: É como a turma decidindo as regras do recreio. Cada proposta é discutida e votada antes de
    valer para todos.
  no_atlas: O Atlas mostra as comissões do Congresso e quem está em cada uma.
  link: br-congresso-nacional
  palavras:
  - termo: projeto de lei
    e: Texto proposto que só vira lei depois de aprovado.
  - termo: parlamentar
    e: 'Pessoa eleita para o Congresso: deputado ou senador.'
- id: deputado-e-senador
  pergunta: Qual a diferença entre deputado e senador?
  resposta_curta: Deputados representam a população; senadores representam cada estado, em número igual.
  texto: 'São 513 deputados federais, com mandato de quatro anos. Estados com mais gente elegem mais deputados,
    de 8 a 70. São 81 senadores: três por estado e três pelo Distrito Federal. O mandato de senador dura
    oito anos. Os dois votam leis, fiscalizam o governo e participam de comissões. Só o Senado aprova
    os nomes indicados para tribunais e agências.'
  analogia: Imagine um condomínio com prédios de tamanhos diferentes. Uma reunião conta moradores; a outra
    dá uma voz por prédio.
  no_atlas: A página Comparar coloca deputados e senadores lado a lado, por medida.
  link: /comparar/
  palavras:
  - termo: comissão
    e: Grupo menor de parlamentares que estuda um assunto antes da votação.
  - termo: sabatina
    e: Audiência no Senado para aprovar ou recusar um nome indicado.
- id: como-nasce-uma-lei
  pergunta: Como uma lei nasce?
  resposta_curta: Alguém propõe, as duas casas do Congresso votam e o presidente decide.
  texto: O projeto entra numa das casas e passa por comissões. Depois vai ao plenário, onde todos os membros
    votam. Aprovado, segue para a outra casa, que pode mudar o texto. No fim, o presidente tem 15 dias
    úteis para sancionar ou vetar. Sancionar é concordar; vetar é recusar o texto inteiro ou parte dele.
    O Congresso pode derrubar o veto por maioria absoluta, em sessão conjunta.
  analogia: É como um trabalho em grupo revisado por duas turmas. Quem assina no fim ainda pode pedir
    mudanças.
  no_atlas: A página inicial mostra vetos que já passaram do prazo de votação.
  link: br-senado-federal
  palavras:
  - termo: veto
    e: Recusa do presidente a um projeto de lei, inteiro ou em parte.
  - termo: maioria absoluta
    e: Mais da metade de todos os membros, presentes ou não.
  - termo: plenário
    e: Reunião de todos os membros de uma casa para votar.
- id: medida-provisoria
  pergunta: O que é uma medida provisória?
  resposta_curta: É uma regra que o presidente cria com força de lei, por urgência.
  texto: A medida provisória passa a valer assim que é publicada. A Constituição exige relevância e urgência
    para o presidente usá-la. Ela dura 60 dias e pode ser prorrogada por mais 60. Se o Congresso não aprovar
    no prazo, ela perde a validade. Há temas proibidos, como direito penal e matéria eleitoral. O prazo
    para de correr durante o recesso do Congresso.
  analogia: É como um aviso colado no mural da escola. Vale desde já, mas cai se a direção não confirmar.
  no_atlas: O Atlas mostra as medidas provisórias que estão perto de perder o prazo.
  link: /
  palavras:
  - termo: medida provisória
    e: Regra urgente do presidente, com força de lei e prazo curto.
  - termo: caducar
    e: Perder a validade porque o prazo terminou sem aprovação.
- id: juiz-e-supremo
  pergunta: O que faz um juiz?
  resposta_curta: O juiz resolve conflitos aplicando a lei; o Supremo dá a palavra final.
  texto: Quando duas pessoas discordam, uma delas pode procurar a Justiça. O juiz ouve os dois lados e
    decide pela lei. Quem perde pode recorrer a um tribunal, formado por vários juízes. No topo está o
    Supremo Tribunal Federal, com 11 ministros. O Supremo guarda a Constituição e pode anular leis que
    a contrariem. Juízes entram por concurso; ministros do Supremo são indicados e sabatinados.
  analogia: 'É parecido com quem arbitra um jogo de tabuleiro. Essa pessoa não inventa regras: lê o manual
    e aplica.'
  no_atlas: A página do Supremo lista os 11 ministros e quem indicou cada um.
  link: br-supremo-tribunal-federal
  palavras:
  - termo: ministro do Supremo
    e: Juiz do tribunal mais alto do país, até os 75 anos.
  - termo: recorrer
    e: Pedir que um tribunal reveja uma decisão.
- id: quem-vigia-o-governo
  pergunta: Quem vigia o governo?
  resposta_curta: Órgãos de controle conferem as contas, apuram irregularidades e cobram explicações.
  texto: O Tribunal de Contas da União confere como o dinheiro foi gasto. Ele pode mandar devolver valores
    e aplicar multas. O Ministério Público defende a sociedade e acusa quem comete crime. A Controladoria-Geral
    da União audita órgãos por dentro do Executivo. A Controladoria faz parte do Executivo; o Tribunal
    de Contas, não. Qualquer pessoa pode enviar uma denúncia a esses órgãos.
  analogia: É como o conselho fiscal de um condomínio. Ele olha as contas do síndico e pede os comprovantes.
  no_atlas: O Atlas mostra quem fiscaliza quem, com a lei de cada ligação.
  link: br-tribunal-de-contas-da-uniao
  palavras:
  - termo: auditoria
    e: Exame detalhado de contas e processos para encontrar erros.
  - termo: controle externo
    e: Fiscalização feita por fora do órgão que gastou o dinheiro.
- id: de-onde-vem-o-dinheiro
  pergunta: De onde vem o dinheiro do governo?
  resposta_curta: Quase todo o dinheiro vem de impostos e contribuições, pagos por pessoas e empresas.
  texto: Você paga imposto ao comprar comida, roupa ou combustível. Quem trabalha com carteira assinada
    paga imposto de renda e previdência. A União cobra imposto de renda, IPI, IOF e outros. Estados e
    municípios cobram impostos próprios, como ICMS e IPTU. Em 2025, a União arrecadou cerca de 2,5 trilhões
    de reais. Isso dá mais de 10 mil reais por habitante no ano.
  analogia: É como a taxa mensal de um condomínio. Cada morador paga uma parte, e o prédio funciona com
    isso.
  no_atlas: O arrecadômetro mostra quanto a União arrecadou no ano, dia a dia.
  link: br-receita-federal-do-brasil
  palavras:
  - termo: imposto
    e: Valor obrigatório pago ao governo, sem destino marcado de antemão.
  - termo: contribuição
    e: Valor cobrado para financiar algo específico, como a previdência social.
- id: para-onde-vai-o-dinheiro
  pergunta: Para onde vai esse dinheiro?
  resposta_curta: Vai para aposentadorias, saúde, educação, salários, obras e juros da dívida.
  texto: Todo ano o governo propõe um orçamento e o Congresso o aprova. O orçamento é a lista do que pode
    ser gasto. A maior despesa da União é a previdência, que paga aposentadorias. A Constituição manda
    aplicar ao menos 18% da receita de impostos em educação. Em saúde, o mínimo da União é 15% da receita
    corrente líquida. Parte do dinheiro paga juros da dívida, ou seja, empréstimos antigos.
  analogia: É como o orçamento de uma família no começo do mês. Primeiro entra o que não dá para adiar,
    depois o resto.
  no_atlas: Cada órgão mostra quanto empenhou e pagou no ano, por programa.
  link: br-ministerio-da-saude
  palavras:
  - termo: orçamento
    e: Lei anual que diz quanto cada órgão pode gastar.
  - termo: dívida pública
    e: Dinheiro que o governo pegou emprestado e devolve com juros.
  - termo: empenho
    e: 'Primeira etapa do gasto: o governo reserva o valor.'
- id: emenda-parlamentar
  pergunta: O que é uma emenda parlamentar?
  resposta_curta: É uma mudança feita no orçamento por um parlamentar, indicando o destino do dinheiro.
  texto: Deputados e senadores podem indicar para onde vai parte do orçamento. Em geral esse dinheiro
    vai para obras e serviços nos municípios. As emendas individuais somam até 2% da receita corrente
    líquida. Metade desse valor precisa ir para ações e serviços de saúde. O governo é obrigado a executá-las,
    salvo impedimento técnico. Há também emendas de bancada, propostas pelos parlamentares de um estado.
  analogia: É como cada pessoa da casa escolher um item da compra. O total do mercado continua o mesmo,
    mas o destino muda.
  no_atlas: O Atlas mostra as emendas de cada parlamentar e os municípios atendidos.
  link: /comparar/
  palavras:
  - termo: emenda parlamentar
    e: Mudança de parlamentar no orçamento, indicando o destino do dinheiro.
  - termo: receita corrente líquida
    e: Soma das receitas do governo, menos alguns repasses obrigatórios.
- id: como-acompanhar
  pergunta: Como posso acompanhar e cobrar?
  resposta_curta: Você pode consultar dados públicos, pedir informação por lei e procurar quem elegeu.
  texto: Nomeações e exonerações saem todo dia no Diário Oficial da União. O Portal da Transparência mostra
    gastos, salários e contratos da União. A Lei de Acesso à Informação permite pedir dados a qualquer
    órgão. O órgão tem 20 dias para responder, prorrogáveis por mais 10. Você não precisa explicar por
    que quer aquela informação. Gabinetes de deputados e senadores recebem mensagens de qualquer eleitor.
  analogia: É como pedir o extrato das contas do condomínio. Você tem o direito de ver, mesmo sem estar
    no conselho.
  no_atlas: A página Dados traz os arquivos do Atlas para baixar, com a fonte.
  link: /dados/
  palavras:
  - termo: Lei de Acesso à Informação
    e: Lei de 2011 que garante pedir dados públicos a qualquer órgão.
  - termo: Diário Oficial da União
    e: Publicação diária com leis, nomeações e contratos do governo.
glossario:
- termo: União
  e: O governo federal, que cuida do país inteiro.
- termo: Constituição
  e: A lei mais importante do Brasil, de 1988; as outras precisam obedecê-la.
- termo: Poder Executivo
  e: Parte do governo que administra, arrecada e presta serviços.
- termo: Poder Legislativo
  e: Parte que escreve as leis e fiscaliza o Executivo.
- termo: Poder Judiciário
  e: Parte que julga conflitos e diz o que a lei significa.
- termo: ministério
  e: Órgão do Executivo responsável por uma área, como saúde ou educação.
- termo: autarquia
  e: 'Órgão criado por lei, com chefia e orçamento próprios. Exemplo: INSS.'
- termo: empresa pública
  e: 'Empresa que pertence apenas ao governo. Exemplo: Correios.'
- termo: agência reguladora
  e: Órgão que fiscaliza um setor e tem diretores com prazo fixo.
- termo: nomeação
  e: Ato de colocar alguém num cargo público, sem eleição.
- termo: sabatina
  e: Audiência no Senado para aprovar ou recusar um nome indicado.
- termo: mandato
  e: Tempo certo que alguém pode ocupar um cargo.
- termo: veto
  e: Recusa do presidente a um projeto de lei, inteiro ou em parte.
- termo: medida provisória
  e: Regra urgente do presidente, com força de lei e prazo de 60 dias.
- termo: orçamento
  e: Lei anual que diz quanto cada órgão pode gastar.
- termo: emenda parlamentar
  e: Indicação de um parlamentar sobre onde gastar parte do orçamento.
- termo: Diário Oficial da União
  e: Jornal do governo, onde saem leis, nomeações e contratos.
- termo: interino
  e: Quem ocupa um cargo por um tempo, até chegar o titular.
neutralidade: O Atlas da República é apartidário e não defende nenhuma ideologia. O projeto é de código
  aberto e feito por colaboradores voluntários. Cada dado vem com a fonte oficial ao lado, para você conferir.
