# Poder Judiciário. CF/88 arts. 92-126.
- id: br-supremo-tribunal-federal
  type: department
  subtype: tribunal
  sector: judiciario
  ring: 1
  name: Supremo Tribunal Federal
  aliases: [STF, Supremo]
  description: >-
    Guarda da Constituição. Onze ministros nomeados pelo Presidente da República após aprovação do Senado, com
    vitaliciedade até os 75 anos. Julga ações de controle concentrado e o Presidente, parlamentares e ministros
    nas infrações penais comuns.
  cite: CF/88 arts. 101-103
  cite_url: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
  official_url: https://portal.stf.jus.br/
  seats_count: 11

- id: br-conselho-nacional-de-justica
  type: commission
  sector: judiciario
  ring: 2
  name: Conselho Nacional de Justiça
  aliases: [CNJ]
  description: >-
    Controla a atuação administrativa e financeira do Poder Judiciário e o cumprimento dos deveres dos juízes.
    Quinze membros com mandato de dois anos, presididos pelo Presidente do STF.
  cite: CF/88 art. 103-B
  cite_url: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
  official_url: https://www.cnj.jus.br/
  seats_count: 15

- id: br-superior-tribunal-de-justica
  type: department
  subtype: tribunal
  sector: judiciario
  ring: 2
  name: Superior Tribunal de Justiça
  aliases: [STJ]
  description: >-
    Uniformiza a interpretação da lei federal. Trinta e três ministros nomeados pelo Presidente da República após
    aprovação do Senado, escolhidos entre desembargadores, advogados e membros do Ministério Público.
  cite: CF/88 arts. 104-105
  cite_url: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
  official_url: https://www.stj.jus.br/
  seats_count: 33

- id: br-tribunal-superior-do-trabalho
  type: department
  subtype: tribunal
  sector: judiciario
  ring: 2
  name: Tribunal Superior do Trabalho
  aliases: [TST]
  description: >-
    Instância máxima da Justiça do Trabalho. Vinte e sete ministros nomeados pelo Presidente após aprovação do
    Senado.
  cite: CF/88 art. 111-A
  cite_url: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
  official_url: https://www.tst.jus.br/
  seats_count: 27

- id: br-tribunal-superior-eleitoral
  type: department
  subtype: tribunal
  sector: judiciario
  ring: 2
  name: Tribunal Superior Eleitoral
  aliases: [TSE]
  description: >-
    Instância máxima da Justiça Eleitoral; organiza as eleições e julga o registro e a cassação de candidatos.
    Sete membros: três ministros do STF e dois do STJ eleitos por seus pares, e dois advogados nomeados pelo
    Presidente a partir de lista sêxtupla do STF.
  cite: CF/88 arts. 118-121
  cite_url: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
  official_url: https://www.tse.jus.br/
  seats_count: 7

- id: br-superior-tribunal-militar
  type: department
  subtype: tribunal
  sector: judiciario
  ring: 2
  name: Superior Tribunal Militar
  aliases: [STM]
  description: >-
    Instância máxima da Justiça Militar da União. Quinze ministros vitalícios nomeados pelo Presidente após
    aprovação do Senado: dez oficiais-generais e cinco civis.
  cite: CF/88 arts. 122-124
  cite_url: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm
  official_url: https://www.stm.jus.br/
  seats_count: 15

