sugestoes_visuais:
- id: o-que-e-governo
  ideia: 'Três caixas empilhadas: União, estado e município, com um serviço de exemplo
    dentro de cada.'
- id: tres-poderes
  ideia: Triângulo com um poder em cada ponta e setas de mão dupla mostrando quem
    confere quem.
- id: o-que-faz-o-presidente
  ideia: Régua de quatro anos, marcando a posse em 1º de janeiro e o fim do mandato.
- id: ministro-e-ministerio
  ideia: 'Organograma simples: presidente no topo, ministérios abaixo, secretarias
    num terceiro nível.'
- id: quem-escreve-as-leis
  ideia: 'Duas barras lado a lado: 513 quadradinhos e 81 quadradinhos, na mesma
    escala.'
- id: deputado-e-senador
  ideia: Mapa do Brasil com três cadeiras iguais por estado e cadeiras proporcionais
    à população.
- id: como-nasce-uma-lei
  ideia: 'Trilho horizontal com estações: comissão, plenário, outra casa, sanção
    ou veto.'
- id: medida-provisoria
  ideia: Ampulheta em duas metades de sessenta dias, com bifurcação entre virar
    lei e caducar.
- id: juiz-e-supremo
  ideia: 'Pirâmide de três degraus: juiz, tribunal e Supremo, com uma seta de recurso
    subindo.'
- id: quem-vigia-o-governo
  ideia: Círculo do governo com três lupas apontando de fora e de dentro, cada uma
    rotulada.
- id: de-onde-vem-o-dinheiro
  ideia: Funil com entradas de imposto e contribuição e um cronômetro marcando o
    valor por segundo.
- id: para-onde-vai-o-dinheiro
  ideia: Barra de cem por cento fatiada por destino, com os pisos de saúde e educação
    destacados.
- id: emenda-parlamentar
  ideia: Cofre do orçamento com setas finas saindo para municípios, metade delas
    marcada como saúde.
