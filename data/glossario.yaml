# Glossário da área educativa. Chave = termo como aparece em [[...]]; a comparação ignora acentos e maiúsculas.
administração direta: >-
  Órgãos que fazem parte do próprio ente, sem personalidade jurídica própria: ministérios, secretarias, departamentos.
  (DL 200/1967 art. 4º, I)
administração indireta: >-
  Entidades criadas por lei com personalidade jurídica própria, vinculadas a um ministério que as supervisiona:
  autarquias, fundações, empresas públicas, sociedades de economia mista. (DL 200/1967 art. 4º, II)
autarquia: >-
  Entidade criada por lei para prestar um serviço público típico do Estado, com patrimônio e gestão próprios. Ex.:
  INSS, Ibama, Banco Central. (DL 200/1967 art. 5º, I)
fundação pública: >-
  Entidade sem fins lucrativos criada por lei para atividades como pesquisa, ensino, cultura e assistência. Ex.:
  IBGE, Funai, Fiocruz. (DL 200/1967 art. 5º, IV)
empresa pública: >-
  Empresa cujo capital pertence integralmente à União, que atua em atividade econômica ou serviço público. Ex.:
  Correios, Caixa, BNDES. (DL 200/1967 art. 5º, II)
sociedade de economia mista: >-
  Sociedade anônima com ações negociadas no mercado, mas com controle da União. Ex.: Petrobras, Banco do Brasil.
  (DL 200/1967 art. 5º, III)
agência reguladora: >-
  Autarquia em regime especial que regula e fiscaliza um setor, com diretores de mandato fixo e decisão colegiada.
  Ex.: Anatel, Anvisa, Aneel. (Lei 9.986/2000; Lei 13.848/2019)
supervisão ministerial: >-
  Poder do ministério sobre as entidades vinculadas a ele: aprova programas, acompanha resultados, nomeia dirigentes
  quando a lei permite. (DL 200/1967 arts. 19-26)
sabatina: >-
  Arguição pública em comissão do Senado, seguida de votação secreta no plenário, para aprovar ou rejeitar quem
  o Presidente indicou para um cargo. (CF/88 art. 52, III; RISF art. 383)
mandato fixo: >-
  Prazo definido em lei para o exercício de um cargo, durante o qual o ocupante só perde o cargo por renúncia, condenação
  ou processo disciplinar, não por decisão do Presidente. (Lei 9.986/2000 art. 9º)
livre nomeação e exoneração: >-
  Cargo que o Presidente preenche e esvazia por decisão própria, sem prazo nem aprovação de outro poder. É o caso
  dos ministros de Estado. (CF/88 art. 84, I; art. 37, II)
vitalício: >-
  Garantia de permanência no cargo até a aposentadoria compulsória, aos 75 anos, salvo condenação judicial. Vale
  para magistrados e ministros dos tribunais. (CF/88 art. 95, I; art. 40 §1º, II)
lista tríplice: >-
  Lista de três nomes elaborada por um órgão, da qual o Presidente escolhe um. Usada em vagas do STJ, dos tribunais
  regionais e, por costume, para o Procurador-Geral da República. (CF/88 art. 104, parágrafo único)
quinto constitucional: >-
  Regra que reserva um quinto das vagas dos tribunais regionais e dos TJs a advogados e membros do Ministério Público,
  escolhidos por lista. (CF/88 art. 94)
proporcional: >-
  Sistema em que as cadeiras são distribuídas entre os partidos na proporção dos votos recebidos, e dentro do partido
  pelos candidatos mais votados. Elege deputados e vereadores. (CF/88 art. 45)
voto majoritário: >-
  Sistema em que vence o candidato mais votado. Elege Presidente, governadores, prefeitos e senadores. (CF/88 art.
  46; art. 77)
controle externo: >-
  Fiscalização do gasto público feita de fora do poder que gasta: pelo Congresso, com auxílio do TCU. (CF/88 arts.
  70-71)
controle interno: >-
  Fiscalização feita pelo próprio poder sobre seus órgãos. No Executivo federal, pela Controladoria-Geral da União.
  (CF/88 art. 74)
empenho: >-
  Primeira etapa da despesa: o governo reserva no orçamento o valor de um gasto autorizado, criando a obrigação
  de pagar. (Lei 4.320/1964 art. 58)
liquidação: >-
  Segunda etapa: a administração verifica que o bem foi entregue ou o serviço prestado e apura quanto deve. (Lei
  4.320/1964 art. 63)
pagamento: >-
  Terceira etapa: o dinheiro sai efetivamente do Tesouro para o credor. (Lei 4.320/1964 art. 64)
Diário Oficial da União: >-
  Publicação diária oficial da União. A Seção 1 traz leis e decretos; a Seção 2, atos de pessoal, como nomeações
  e exonerações; a Seção 3, contratos e editais. (Decreto 9.215/2017)
interino: >-
  Quem exerce um cargo provisoriamente, até a nomeação do titular ou o retorno dele. Aparece marcado no Atlas.
membro nato: >-
  Quem integra um colegiado por força do cargo que ocupa, sem eleição ou nomeação específica. Ex.: o presidente
  do STF preside o CNJ.
decreto: >-
  Ato do Presidente que regulamenta leis e organiza a administração. Não pode criar obrigações que a lei não previu.
  (CF/88 art. 84, IV e VI)
portaria: >-
  Ato de um ministro ou dirigente para organizar seu órgão, designar pessoas ou aplicar normas superiores.
CCE: >-
  Cargo Comissionado Executivo, cargo de confiança da administração federal preenchido por nomeação, com níveis
  de 1 a 18. (Lei 14.204/2021)
plenário: >-
  Reunião de todos os membros de uma Casa ou tribunal. É onde se votam as decisões finais.
crime de responsabilidade: >-
  Infração política do Presidente, de ministros e outras autoridades contra a Constituição, julgada pelo Senado
  e punida com perda do cargo. (CF/88 arts. 85-86; Lei 1.079/1950)
