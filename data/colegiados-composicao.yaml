# Composição por cargo dos colegiados do Executivo. Curado à mão a partir da norma que cria cada
# colegiado (lei ou decreto), lida no texto compilado do Planalto — ou, quando a norma não é do
# Planalto, na fonte oficial do órgão (Banco Central, Confaz).
#
# A composição desses conselhos é quase sempre POR CARGO (membro nato): o assento pertence ao cargo,
# e o ocupante vem do grafo. Por isso aqui não se nomeia pessoa alguma.
#
# Campos de cada colegiado:
#   id                 id do nó (commission/advisory) em build/graph.br.json
#   norma / norma_url  norma e artigo que definem a composição, com a URL consultada
#   checked_at         data em que o texto foi conferido na fonte
#   presidido_por      id do cargo que preside, quando a norma nomear um cargo (senão ausente)
#   membros[]          cargo_id (dept_head/elected do grafo, ou null), cargo_texto (texto da norma),
#                      tipo (nato|indicado|eleito|externo), assentos, note
#   vagas_sociedade    assentos de representação da sociedade civil, sem nomear pessoas
#
# REGRA DE CASAMENTO: cargo_id só é preenchido quando a norma nomeia um CARGO ("o Ministro de Estado
# da Fazenda", "o Presidente do Banco Central"). Quando a norma dá o assento a um ÓRGÃO ou ENTIDADE
# ("um representante do Ibama", "Ministério do Turismo"), o titular do assento não é um cargo do
# grafo e cargo_id fica null — só o texto da norma é guardado. Nunca se infere composição.
#
# Gerado para o build por etl/colegiados.py → data/generated/colegiados.yaml

fonte: Normas de criação e regulamentação de cada colegiado (Planalto, Banco Central, Confaz), lidas no texto compilado vigente

