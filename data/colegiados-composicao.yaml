  - id: br-conselho-nacional-da-amazonia-legal
    motivo: >-
      Não há norma de composição vigente. O Decreto 10.239/2020 e o Decreto 10.450/2020, que dispunham sobre
      o Conselho, foram expressamente revogados pelo art. 15, II e IV, do Decreto 11.367/2023, e nenhuma norma
      posterior recriou o colegiado. O nó segue no grafo por vir do registro do SIORG.
