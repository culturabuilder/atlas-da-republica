# Quanto cada CARGO do grafo paga, segundo a lei — curado à mão, uma entrada por família de cargos.
#
# Regras editoriais:
#   - `subsidio_mensal_bruto` é sempre BRUTO e MENSAL, em reais, e vem sempre com `norma` + `norma_url`.
#   - Sem norma localizada, `subsidio_mensal_bruto: null` e `observacao` explicando. Nunca se estima valor.
#   - `teto: true` quando a norma fixa um limite, não um valor fixo pago a todos.
#   - `beneficios` nunca entram no subsídio. Os `indenizatoria` são reembolso ou custeio e não são renda;
#     os `remuneratoria` são parcelas da remuneração. Não se soma benefício a subsídio.
#   - Sem comparação e sem juízo: o arquivo diz quanto a lei manda pagar e onde isso está escrito.
#
# Casamento com o grafo (etl/subsidios.py):
#   `cargos`        ids exatos ou padrões glob ("*-reitor", "br-ministro-de-estado-*")
#   `orgao_subtype` todo cargo que chefia um órgão daquele subtype ("sociedade_economia_mista")
#   `nome_padrao`   regex sobre o nome do cargo, para refinar o conjunto acima
#   `excluir`       ids a tirar do conjunto
#
# Âncora de quase tudo: o subsídio de Ministro do STF, R$ 46.366,19 desde 1º/2/2025 (Lei 14.520/2023),
# que é o teto do art. 37, XI, da Constituição. Não houve reajuste em 2025 nem em 2026.
#
# Corte de 2026 no Judiciário e no Ministério Público: em 25/3/2026 o Supremo fixou tese de repercussão geral
# unificando o teto e extinguindo a maior parte dos pagamentos extras de magistrados e membros do Ministério
# Público — auxílio-alimentação, assistência pré-escolar, auxílio-creche, licença compensatória por acúmulo de
# acervo e outros. A Resolução Conjunta CNJ/CNMP 14, de 6/4/2026, regulamentou o que resta: subsídio mais, no
# máximo, 35% em parcela de antiguidade e 35% em verbas indenizatórias. Efeitos desde o mês-base abril de 2026.
# Os benefícios extintos ficam registrados nas famílias com valor zero, para que a mudança fique legível.

