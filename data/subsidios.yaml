          2026, quando o Supremo unificou o teto e extinguiu a maior parte dos pagamentos extras.
      - nome: Auxílio-saúde
        valor_mensal_ou_teto: null
        natureza: indenizatoria
        norma: Resolução Conjunta CNJ/CNMP 14/2026 art. 5º "d"; Resolução CNMP 268, de 8/8/2023
        norma_url: https://atos.cnj.jus.br/atos/detalhar/6863
        note: >-
          Não é valor fixo: é reembolso do que foi efetivamente pago e comprovado, limitado a 15% do subsídio,
          com os dependentes dentro desse limite. O Supremo proibiu expressamente o pagamento em valor fixo.
      - nome: Diárias em deslocamento a serviço
        valor_mensal_ou_teto: null
        natureza: indenizatoria
        norma: Resolução Conjunta CNJ/CNMP 14/2026 art. 6º; LC 75/1993 art. 227 II; Resolução CNJ 73, de 28/4/2009
