        note: >-
          Uma linha entre muitas: a tabela tem três regimes (20h, 40h, dedicação exclusiva) e as classes de
          Assistente a Titular. Associado 1 em dedicação exclusiva, por exemplo, são R$ 9.616,10.
      - nome: Retribuição por Titulação (doutorado, Titular 1, dedicação exclusiva)
