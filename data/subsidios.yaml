    subsidio_mensal_bruto: 44047.88
    moeda: BRL
    vigencia_desde: 2025-02-01
    norma: Lei 11.365/2006 art. 1º, combinada com a Lei 14.520/2023 e o art. 93 V da Constituição
    norma_url: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11365.htm
    checked_at: 2026-09-22
    observacao: >-
      "Os membros do Conselho Nacional de Justiça perceberão mensalmente o equivalente ao subsídio de Ministro de
      Tribunal Superior" (art. 1º). Quem já é ministro do STF, do STJ ou do TST mantém o subsídio da própria corte,
      sem acréscimo no Conselho; quem tem vínculo efetivo com o poder público mantém a remuneração de origem
      acrescida apenas da diferença até esse valor; advogados e cidadãos indicados sem vínculo público recebem o
      valor integral. O Presidente do CNJ é o Presidente do STF e recebe pelo STF.
