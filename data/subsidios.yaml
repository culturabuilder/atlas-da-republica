    norma_url: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2016/lei/l13303.htm
    checked_at: 2026-09-22
    observacao: >-
      Não existe lei que fixe quanto paga o cargo de presidente ou diretor de empresa estatal federal. A
      remuneração da diretoria é aprovada a cada ano pela assembleia geral de acionistas (Lei 6.404/1976 art. 152),
      sob parâmetros da Secretaria de Coordenação e Governança das Empresas Estatais do Ministério da Gestão, e
      divulgada depois nos documentos societários de cada empresa — ata de assembleia, relatório da administração
      e, nas companhias abertas, o Formulário de Referência da CVM. Por isso o valor é diferente em cada estatal e
      muda todo ano. O teto do art. 37, XI, só alcança as estatais dependentes de recursos do Tesouro
      (CF art. 37 §9º), e não as que se custeiam com receita própria. Para saber o valor de uma empresa
      específica, a fonte é o documento societário dela, não uma norma geral.
    beneficios: []

