  - familia: ministro-do-tribunal-superior-eleitoral
    cargos: [br-tribunal-superior-eleitoral-ministro, br-tribunal-superior-eleitoral-presidente]
    subsidio_mensal_bruto: null
    moeda: BRL
    vigencia_desde: null
    norma: CF art. 119; Lei 8.350/1991 art. 2º, com a redação da Lei 11.143/2005
    norma_url: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11143.htm
    checked_at: 2026-09-22
    observacao: >-
      O TSE não tem quadro próprio de ministros: é composto por três ministros do STF, dois do STJ e dois juristas
      nomeados pelo Presidente da República, todos em mandato temporário. Cada um continua recebendo o subsídio do
      tribunal de origem — R$ 46.366,19 no STF, R$ 44.047,88 no STJ — de modo que não existe um único valor de
      cargo. A Lei 10.474/2002 art. 1º §1º ainda determina que as parcelas anuais recebidas por ministro do STF em
      razão do exercício temporário no TSE não entrem no cômputo dos limites remuneratórios. Não foi localizada
      norma vigente que fixe um valor mensal próprio do cargo de Ministro do TSE, nem para os dois juristas
      vindos da advocacia, que não têm cargo de origem no Judiciário.
    beneficios:
      - nome: Gratificação de presença nas sessões do TSE
        valor_mensal_ou_teto: null
        natureza: remuneratoria
        norma: Lei 8.350/1991 art. 1º I; Resolução Conjunta CNJ/CNMP 14/2026 art. 4º "c"; CF art. 121 §2º
        norma_url: https://www.planalto.gov.br/ccivil_03/leis/L8350.htm
        note: >-
          3% do vencimento básico de ministro do STF por sessão a que o ministro comparece, no máximo oito por
          mês e quinze nos noventa dias antes e depois de eleição geral. Foi uma das poucas verbas preservadas
          pelo Supremo na decisão de 2026 sobre o teto, e fica fora dele. Não foi localizado ato que publique o
          valor em reais para 2026.

