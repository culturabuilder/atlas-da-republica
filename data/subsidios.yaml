        norma: Lei 12.772/2012 art. 17 e Anexo IV, na redação do Anexo LXXX da Lei 15.141/2025 (efeitos de 1º/4/2026)
        norma_url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/Anexo/Anexo1a100-Lei15141.htm
