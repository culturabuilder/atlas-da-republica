        norma: Portaria MGI 2.756/2026, de 31/3/2026; Lei 8.460/1992 art. 22
        norma_url: https://www.in.gov.br/en/web/dou/-/portaria-mgi-n-2.756-de-31-de-marco-de-2026-697045786
