          exclusiva recebe R$ 11.058,51.
      - nome: Cargo de Direção CD-1
        valor_mensal_ou_teto: 22219.64
        natureza: remuneratoria
        norma: Lei 15.141/2025, Anexo CCXCVII, alínea "c" (efeitos de 1º/1/2026); Lei 8.168/1991
        norma_url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/Anexo/Anexo254a323-Lei15141.htm
        note: >-
          Valor integral do CD-1. O docente em dedicação exclusiva quase sempre opta pelo vencimento do cargo
          efetivo mais 60% do CD-1, R$ 13.331,78 (Lei 11.526/2007 art. 2º III e §1º), porque o total sai maior.
          CD-2 são R$ 16.806,33; CD-3, R$ 12.291,61; CD-4, R$ 8.315,71.
      - nome: Auxílio-alimentação
        valor_mensal_ou_teto: 1192.0
