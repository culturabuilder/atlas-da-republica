  - familia: conselheiro-do-conselho-nacional-do-ministerio-publico
    cargos: [br-conselheiro-do-cnmp]
    subsidio_mensal_bruto: null
    moeda: BRL
    vigencia_desde: null
    norma: CF art. 130-A; Lei 11.372/2006
    norma_url: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11372.htm
    checked_at: 2026-09-22
    observacao: >-
      A Lei 11.372/2006, que estrutura o Conselho Nacional do Ministério Público, não tem artigo sobre
      remuneração — ao contrário da Lei 11.365/2006, que faz isso para o Conselho Nacional de Justiça e equipara
      o conselheiro ao Ministro de Tribunal Superior. Diz apenas, no art. 10, que "aos Conselheiros são
      asseguradas as prerrogativas conferidas em lei aos membros do Ministério Público". Os vetos de 2006 ao
      projeto trataram de estrutura organizacional, não de remuneração. Não existe, portanto, norma que fixe o
      subsídio do conselheiro do CNMP: o colegiado reúne membros do Ministério Público da União e dos Estados,
      juízes, advogados indicados pela OAB e cidadãos indicados pelo Congresso, e cada um mantém o que recebe no
      órgão de origem. A Resolução Conjunta CNJ/CNMP 14/2026, que reorganizou os pagamentos do Judiciário e do
      Ministério Público depois da decisão do Supremo sobre o teto, também alcança os conselheiros.
    beneficios: []

