      - nome: Parcela por antiguidade
        valor_mensal_ou_teto: null
        natureza: remuneratoria
        norma: Resolução Conjunta CNJ/CNMP 14, de 6/4/2026, art. 3º; LC 35/1979 (Loman) art. 65 VIII
        norma_url: https://atos.cnj.jus.br/atos/detalhar/6863
