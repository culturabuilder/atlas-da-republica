    norma_url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/L14520.htm
    checked_at: 2026-09-22
    observacao: >-
      É o teto remuneratório de todo o serviço público brasileiro (CF art. 37, XI). A lei implantou o valor em
      três parcelas: R$ 41.650,92 (1º/4/2023), R$ 44.008,52 (1º/2/2024) e R$ 46.366,19 (1º/2/2025). O Presidente
      do STF recebe o mesmo subsídio dos demais ministros.
    beneficios:
      - nome: Parcela por antiguidade
        valor_mensal_ou_teto: null
        natureza: remuneratoria
        norma: Resolução Conjunta CNJ/CNMP 14, de 6/4/2026, art. 3º; LC 35/1979 (Loman) art. 65 VIII
        norma_url: https://atos.cnj.jus.br/atos/detalhar/6863
        note: >-
          5% do subsídio a cada cinco anos de atividade jurídica, até o limite de 35%. Criada na reorganização de
          2026, quando o Supremo unificou o teto e extinguiu a maior parte dos pagamentos extras.
      - nome: Auxílio-saúde
        valor_mensal_ou_teto: null
        natureza: indenizatoria
        norma: Resolução Conjunta CNJ/CNMP 14/2026 art. 5º "d"; Resolução CNMP 268, de 8/8/2023
        norma_url: https://atos.cnj.jus.br/atos/detalhar/6863
        note: >-
          Não é valor fixo: é reembolso do que foi efetivamente pago e comprovado, limitado a 15% do subsídio,
          com os dependentes dentro desse limite. O Supremo proibiu expressamente o pagamento em valor fixo.
      - nome: Diárias em deslocamento a serviço
        valor_mensal_ou_teto: null
        natureza: indenizatoria
        norma: Resolução Conjunta CNJ/CNMP 14/2026 art. 6º; LC 75/1993 art. 227 II; Resolução CNJ 73, de 28/4/2009
        norma_url: https://atos.cnj.jus.br/atos/detalhar/6863
        note: >-
          Por dia, não por mês, e só fora da comarca, sede ou circunscrição. O piso legal é um trinta avos dos
          vencimentos; cada tribunal fixa a própria tabela, com teto na diária paga a ministro do STF.
      - nome: Ajuda de custo de remoção, promoção ou nomeação
        valor_mensal_ou_teto: null
        natureza: indenizatoria
        norma: Resolução Conjunta CNJ/CNMP 14/2026 art. 8º; LC 75/1993 art. 227 I "a"; LC 35/1979 art. 65 I
        norma_url: https://atos.cnj.jus.br/atos/detalhar/6863
        note: >-
          Até três meses de vencimentos, uma única vez, e só quando há efetiva mudança de domicílio legal.
          Não é parcela mensal.
      - nome: Auxílio-moradia
        valor_mensal_ou_teto: 4377.73
        natureza: indenizatoria
        norma: Resolução CNJ 274, de 18/12/2018 art. 4º; Resolução Conjunta CNJ/CNMP 14/2026 art. 7º
        norma_url: https://atos.cnj.jus.br/atos/detalhar/2792
        note: >-
          Teto de reembolso, em hipótese hoje restritíssima: só para quem é convocado a servir fora da comarca de
          origem, sem imóvel funcional disponível e sem ser proprietário no município, mediante comprovação da
          despesa. O auxílio-moradia geral foi extinto pelo Supremo em 2026. A Resolução CNJ 274/2018 fixa o teto
          em R$ 4.377,73 e a Resolução CNMP 194/2018, aplicável ao Ministério Público, o fixa em 25% do subsídio
          do Procurador-Geral da República; as duas seguem publicadas como vigentes.
      - nome: Décimo terceiro e terço constitucional de férias
        valor_mensal_ou_teto: null
        natureza: remuneratoria
        norma: CF art. 7º VIII e XVII, aplicados pelo art. 39 §3º; Resolução Conjunta CNJ/CNMP 14/2026 art. 4º
        norma_url: https://atos.cnj.jus.br/atos/detalhar/6863
        note: >-
          Não são parcelas mensais e, por decisão do Supremo de 2026, não se somam entre si nem à remuneração do
          mês em que são pagas, embora nenhuma possa isoladamente ultrapassar o teto. As férias de magistrado e
          de membro do Ministério Público são de sessenta dias por ano; a indenização de férias não gozadas está
          limitada a trinta dias por exercício.
      - nome: Benefícios extintos em 2026
        valor_mensal_ou_teto: 0.0
        natureza: indenizatoria
        norma: >-
          Tese de repercussão geral do STF de 25/3/2026 (Rcl 88.319, ADI 6.601, ADI 6.604, ADI 6.606, RE 968.646
          e RE 1.059.466), item 7; Resolução Conjunta CNJ/CNMP 14/2026 art. 2º
        norma_url: https://noticias.stf.jus.br/postsnoticias/stf-aprova-tese-que-unifica-teto-salarial-e-extingue-pagamentos-extras-para-magistratura-e-mp/
        note: >-
          Registro do que deixou de existir a partir da folha de maio de 2026, mês-base abril: auxílio-alimentação
          (que valia R$ 1.784,42), assistência pré-escolar e auxílio-creche (R$ 1.235,77 por dependente), auxílio
          natalino, auxílio-combustível, licença compensatória e indenização por acúmulo de acervo, gratificação
          por localidade, indenização de serviços de telecomunicação e auxílio-natalidade. Também ficou vedada a
          conversão de licenças em dinheiro. A verba criada em substituição à pré-escolar, a gratificação de
          proteção à primeira infância de 3% do subsídio, teve o pagamento suspenso pela Corregedoria Nacional
          de Justiça.

