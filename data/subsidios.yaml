    subsidio_mensal_bruto: 44047.88
    moeda: BRL
    vigencia_desde: 2025-02-01
    norma: >-
      Lei 14.521/2023, com o escalonamento da carreira do Ministério Público da União (nível II, 95% do subsídio
      do Procurador-Geral da República); CF art. 129 §4º, que manda aplicar o art. 93 V
    norma_url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/L14521.htm
    checked_at: 2026-09-22
    observacao: >-
      Procurador-Geral do Trabalho, Procurador-Geral da Justiça Militar e Procurador-Geral de Justiça do Distrito
      Federal e Territórios chefiam ramos do Ministério Público da União e ficam no nível II da tabela de
      subsídios do MPU, ao lado dos subprocuradores-gerais: 95% do subsídio do Procurador-Geral da República.
      A tabela oficial publicada pelo Ministério Público Federal está em
      https://transparencia.mpf.mp.br/conteudo/gestao-de-pessoas/plano-de-carreira/tabelas-procuradores-2015_2025-lei-14521-de-22-11-2023.pdf
      Os níveis seguintes são R$ 41.845,49 (procurador regional) e R$ 39.753,22 (procurador da República).
      Não há acréscimo pelo exercício da chefia: o regime é de subsídio em parcela única.
