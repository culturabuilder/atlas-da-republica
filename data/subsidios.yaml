    norma: >-
      Lei 12.772/2012 arts. 16, 17 e 21 (carreira do Magistério Superior), com os anexos na redação da
      Lei 15.141/2025; Lei 11.526/2007 art. 2º (opção de remuneração); Lei 8.168/1991 (Cargos de Direção)
    norma_url: https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2012/lei/l12772.htm
    checked_at: 2026-09-22
    observacao: >-
      Não existe um valor de cargo para reitor de universidade federal. O reitor é professor da carreira do
      Magistério Superior e sua remuneração é a soma de parcelas tabeladas que dependem da classe, do nível, da
      titulação e do regime de trabalho dele, mais o Cargo de Direção CD-1, e ainda da opção que ele faz entre as
      três formas do art. 2º da Lei 11.526/2007. Dois reitores de universidades diferentes recebem valores
      diferentes, e o mesmo reitor recebe outro valor ao progredir na carreira. As parcelas estão listadas em
      `beneficios` como componentes remuneratórios, com os valores da tabela. Um reitor professor titular em
      dedicação exclusiva, doutor, que opte pelos 60% do CD-1, soma R$ 12.245,03 de vencimento básico,
      R$ 14.081,78 de retribuição por titulação e R$ 13.331,78 de CD-1, num bruto de R$ 39.658,59 — mas esse é
      um caso, não o valor do cargo. Tudo fica abaixo do teto de R$ 46.366,19. Esta família cobre também os
      diretores-gerais dos CEFET e o reitor do Colégio Pedro II, que é da carreira do magistério do ensino
      básico, técnico e tecnológico, com tabela própria, e não da do magistério superior.
