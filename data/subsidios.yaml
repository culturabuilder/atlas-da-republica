          antiguidade e verbas indenizatórias limitadas a 35% do subsídio em cada bloco, auxílio-saúde por
          reembolso comprovado até 15%, e nada de auxílio-alimentação ou assistência pré-escolar, extintos pelo
          Supremo em 2026.

