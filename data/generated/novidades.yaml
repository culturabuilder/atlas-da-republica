  titulo: 'Área ''Do zero'': o governo explicado em palavras simples, para quem nunca estudou isso'
  texto: '14 perguntas, da mais básica à mais específica: o que é governo, por que existem três poderes, o que faz um ministro, quem escreve as
    leis, como uma lei nasce, por que medida provisória tem prazo, quem vigia o governo, de onde vem e para onde vai o dinheiro, o que é emenda
    parlamentar e como acompanhar. Cada uma com resposta curta, explicação em frases de até 15 palavras, uma comparação do dia a dia, as palavras
    difíceis explicadas e o link para ver aquilo no mapa. Mais um glossário de 18 termos.'
