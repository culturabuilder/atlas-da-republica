  titulo: Retira do ar o custo da cadeira e a comparação entre cargos até refazer o cálculo
  texto: 'A auditoria interna mediu quatro erros no que estava publicado, contra 13 folhas mensais do SIAPE: - extrapolar um mês para o ano erra
    de -21% a +74% conforme o mês; o mês usado (julho) subestimava em 10% - o 13º do Executivo cai em junho e novembro, e não entrava na conta
    - parcelas já contidas no salário da folha eram somadas de novo como benefício (reitores e comandantes), o que fazia ''reitor'' aparecer como
    a segunda cadeira mais cara - auxílio-moradia entrava pelo teto legal, não pelo gasto, em todas as cadeiras - 236 dos 249 cargos com viagens
    tinham amostra de uma pessoa - o divisor da cota parlamentar usava 9 meses onde o arquivo tem 6,55, subestimando em 37% - a equipe do gabinete
    do Senado entrava como zero, omitindo cerca de meio bilhão por ano'
