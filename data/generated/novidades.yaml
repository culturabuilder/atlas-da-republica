  texto: 'Esta rodada começou com o `git pull --rebase` recusando trabalhar: quatro arquivos modificados sem commit. Não era ninguém mexendo no
    repositório, era o próprio eval. Ele constrói para verificar, e construir reescreve README, _execucao.yaml, tenures.json e graph.br.js. O
    campo last_seen carimba a data de hoje, então todo primeiro eval de um dia novo suja a árvore e trava o pull do eval seguinte.'
