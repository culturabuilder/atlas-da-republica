  titulo: Conserta o passo de commit do job diário, que eu quebrei ontem
  texto: A atualização de hoje coletou tudo em 1h04 e morreu no mesmo passo de ontem, por causa do meu próprio conserto. Eu troquei o push direto
    por um rebase, e rebase exige árvore limpa. O `git add` do job cobre data/generated, assets/img e web/graph.br.js, mas o build também reescreve
    o README, que é onde mora a tabela de cobertura. Ele ficava como alteração solta e o rebase se recusava a rodar, nas três tentativas.
