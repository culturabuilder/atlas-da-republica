  texto: O site passa a dizer, antes de qualquer dado, que é apartidário, de código aberto e mantido por colaboradores, sem financiamento de partido,
    campanha ou governo; que não dá nota nem classifica ninguém; e que quando a fonte não publica um dado, o site diz isso em vez de estimar.
    A metodologia ganhou a seção completa e o menu, o atalho.
