  titulo: 'Custo da cadeira: o salário é só uma parte, e agora o site mostra o resto'
  texto: 'Página do cargo: ''Quanto custa esta cadeira por ano'', com barra empilhada em camadas (salário, benefícios pessoais, equipe do gabinete,
    custeio do mandato, viagens), cada uma rotulada por natureza (vai para a pessoa, paga outras pessoas, reembolsa despesa) e pela origem do
    número (folha, gasto real ou norma). Traz o total do colegiado, a escala em salários mínimos, o que a fonte não publica e o que fica de fora
    da conta. Aba do dinheiro: comparação entre famílias de cargo, com barras proporcionais entre si. Medido: uma cadeira de deputado custa R$
    2,9 mi por ano e o salário é 19% disso; as 513 somam R$ 1,5 bi. Senador R$ 1 mi (53% salário), ministro de Estado R$ 940 mil (67%), ministro
    do Supremo R$ 556 mil (100%).'
