  tema-precatorios:
    kind: tema
    title: PEC dos Precatórios
    resumo: A PEC dos Precatórios é uma proposta de mudança na Constituição. Ela cria um limite para os municípios pagarem
      precatórios — dívidas judiciais que o poder público deve pagar — e abre prazo para os municípios parcelarem débitos
      com regimes de previdência. A proposta virou norma jurídica, ou seja, virou regra, com último andamento em 9 de setembro
      de 2025. O processo está encerrado.
