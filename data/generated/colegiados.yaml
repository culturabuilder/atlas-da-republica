      note: incisos II a XXIII, um representante por órgão
    - cargo_texto: Anac, Banco da Amazônia, Banco do Brasil, Banco do Nordeste, BNDES, Caixa Econômica Federal, Infraero,
        Suframa e Embratur
      tipo: nato
      assentos: 9
      note: incisos XXIV a XXXII, um representante por entidade da administração indireta
    - cargo_texto: Sebrae, Senac e Sesc
      tipo: externo
      assentos: 3
      note: incisos XXXIII a XXXV, entidades do Sistema S
    - cargo_texto: Fornatur, Anseditur e Confederação Nacional dos Municípios
      tipo: externo
      assentos: 3
      note: incisos XXXVI a XXXVIII, gestores estaduais e municipais de turismo
    - cargo_texto: Comissão de Turismo da Câmara dos Deputados, Comissão de Desenvolvimento Regional e Turismo do Senado Federal
        e Conselho Nacional de Justiça
      tipo: externo
      assentos: 3
      note: incisos XXXIX a XLI
    - cargo_texto: quarenta e oito de organizações da sociedade civil legalmente constituídas, que atuem no setor de turismo
      tipo: eleito
      assentos: 48
      note: escolhidas por processo seletivo público, doze categorias, mandato de dois anos com uma recondução (§§ 9º e 12)
    - cargo_texto: quatro brasileiros com notório saber na área de turismo
      tipo: indicado
      assentos: 4
      note: dois indicados pelo Presidente da República e dois pelo Ministro de Estado do Turismo, sem suplentes (§ 4º)
    vagas_sociedade: 48
    assentos_cargo: 93
    nota: Colegiado de 96 assentos. A norma dá cada assento a um órgão ou entidade ("composto por representantes dos seguintes
      órgãos e entidades"), não a um cargo nominado, salvo a presidência, que o § 1º atribui ao Ministro de Estado do Turismo
      (substituído pelo Secretário-Executivo da pasta, § 2º).
