nota: 'Remuneração do mês publicada pelo Portal da Transparência (Executivo, SIAPE) e pelo Senado Federal; a folha do SIAPE
  sai com cerca de dois meses de atraso. ''bruto'' soma remuneração básica, gratificação natalina, férias e eventuais; ''liquido''
  é a remuneração após deduções obrigatórias. Verbas indenizatórias não são salário e ficam fora do teto por lei, por isso
  entram em componentes.indenizatorias e não no bruto. O SIAPE não discrimina, no download mensal, quanto do bruto é função
  ou gratificação (componentes.funcao fica nulo); a folha do Senado discrimina. Casamentos ambíguos não são gravados: veja
  criterio e confianca em cada registro.'
