name: Eval a cada 3 dias
# O eval só rodava quando alguém o disparava à mão, e foi por isso que Programas e Transferências
# ficaram quatro dias sendo cortados por tempo sem ninguém ver. Aqui ele roda sozinho.
#
# Dois trabalhos em paralelo, de propósito. Na primeira tentativa era um só e passou de 50 minutos
# sem terminar: as checagens de navegador carregam a página mais de cem vezes, cada carregamento
# puxando o grafo inteiro de um servidor local, e num runner de 2 núcleos isso rasteja. Separados,
# cada um tem orçamento próprio e a falha de um não esconde o resultado do outro.
#
# "*/3" no dia do mês dá dias 1, 4, 7 … 28, 31 — a virada de mês encurta um intervalo. É limitação do
# cron de 5 campos; o que importa é não passar de três dias sem olhar.
on:
  schedule: [{ cron: "23 11 */3 * *" }]   # 08:23 em Brasília
  workflow_dispatch:
permissions: { contents: read, actions: read }
concurrency: { group: eval, cancel-in-progress: false }
jobs:
  dados:
    name: Dados, conectores e site no ar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      # A comparação com a execução anterior (queda de 5% em contagem grande) vive em
      # build/_eval_base.json, e build/ não é versionado: sem cache, toda rodada no runner é "primeira
      # execução" e a detecção de queda nunca acontece — justamente a que avisaria se um conector
      # apagasse metade do grafo.
      - uses: actions/cache/restore@v4
        with:
          path: build/_eval_base.json
          key: eval-base-${{ github.run_id }}
          restore-keys: eval-base-
      - name: Rodar o eval sem as checagens de navegador
        id: eval
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
          EIKOS_KEY: ${{ secrets.EIKOS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          scripts/eval.sh --rapido 2>&1 | tee eval.txt
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "## Dados e conectores"
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then echo; echo "Nada a corrigir."; else
              echo; echo "### Pede correção"; echo '```'; grep -E "^   ERRO" eval.txt || true; echo '```'
            fi
            echo "### Avisos"; echo '```'; grep -E "^   !" eval.txt | head -20 || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      # Gravar o cache ANTES do passo que falha, e com if: always(). A primeira versão usava
      # actions/cache, cujo passo de gravação é PULADO quando o trabalho falha — e este trabalho falha
      # justamente quando há achado. Resultado: a linha de base nunca persistia nas rodadas em que
      # serviria, e a detecção de queda ficava para sempre em "primeira execução".
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/_eval_base.json
          key: eval-base-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-dados, path: eval.txt, retention-days: 30 }
      - if: steps.eval.outputs.codigo != '0'
        run: echo "Há itens que pedem correção; veja o resumo." && exit 1

  interface:
    name: Interface em várias larguras
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Construir o site e rodar as seis checagens
        id: checagens
        run: |
          set +e
          .venv/bin/python scripts/build_graph.py > /dev/null 2>&1
          .venv/bin/python scripts/build_site.py > /dev/null 2>&1
          (cd site && nohup python3 -m http.server 8767 >/dev/null 2>&1 &)
          sleep 4
          ruins=0
          : > checagens.txt
          # cada checagem precisa dizer que passou; saída que não casa a frase conta como falha, porque
          # em 27/09/2026 cinco checagens apareceram verdes com as cinco quebrando por falta do playwright
          for par in "overflow:contenção ok" "dzov:contenção ok" "quebra:nenhuma palavra quebrada" \
                     "svgfit:ok" "pmap:erros \[\]" "paginas:nenhuma página rola de lado"; do
            t=${par%%:*}; esperado=${par#*:}
            saida=$(node "scripts/checagens/$t.js" 2>&1); codigo=$?
            if [ $codigo -ne 0 ]; then
              echo "   ERRO $t: node saiu com código $codigo" | tee -a checagens.txt
              echo "$saida" | tail -3 | sed 's/^/        /' | tee -a checagens.txt
              ruins=$((ruins+1))
            elif echo "$saida" | grep -qiE "$esperado"; then
              echo "   ok   $t" | tee -a checagens.txt
            else
              echo "   ERRO $t: não confirmou que passou" | tee -a checagens.txt
              echo "$saida" | tail -4 | sed 's/^/        /' | tee -a checagens.txt
              ruins=$((ruins+1))
            fi
          done
          echo "codigo=$ruins" >> "$GITHUB_OUTPUT"
          { echo "## Interface"; echo '```'; cat checagens.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-interface, path: checagens.txt, retention-days: 30 }
      - if: steps.checagens.outputs.codigo != '0'
        run: echo "Checagens de interface com falha; veja o resumo." && exit 1
