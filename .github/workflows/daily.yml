name: Atualização diária
on:
  # 9h30 UTC em ponto é o horário mais disputado do agendador do GitHub, que entrega o gatilho quando
  # tem folga. Medido nesta semana: 5h10 de atraso num dia, 4h17 noutro, e em 28/09 não disparou.
  # Minuto quebrado cai fora do pico. O atraso continua possível, é da natureza do serviço.
  schedule: [{ cron: "47 8 * * *" }]   # 05:47 em Brasília
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: atualizacao-diaria, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    # teto duro: o orçamento interno de scripts/update.sh (3h30) deve terminar bem antes disto.
    # Se bater aqui, o job morre sem publicar — é o sintoma de que algum conector passou do limite.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install pyyaml pillow anthropic openpyxl
      # Programas e Transferências leem os CSVs mensais de despesa da CGU: dois exercícios, 22 arquivos.
      # O WAF da CGU bloqueia rajada, então há 20s de espera entre downloads — 440s só dormindo, num
      # limite de 900s por conector. Em setembro eram 21 meses e cabia raspando; em outubro virou 22 e
      # os dois passaram a ser cortados todo dia (último sucesso em 30/09/2026). Ler os 22 meses custa
      # 11 segundos: o gasto é todo download. Com o cache, mês de exercício fechado é baixado uma vez
      # na vida e o dia a dia baixa só o mês corrente.
      - name: Cache dos arquivos mensais da CGU e do IBGE
        uses: actions/cache@v4
        with:
          path: |
            build/cache-programas
            build/cache-transferencias
            build/cache-arrecadacao
            build/cache-atividade
          # Chave única por rodada de propósito: com chave fixa o actions/cache não regrava no acerto, e
          # o mês corrente — o único que muda — nunca entraria no cache. restore-keys pega a rodada
          # anterior. O GitHub descarta as entradas mais antigas sozinho quando o repositório chega ao
          # teto de 10 GB; cada entrada aqui tem uns 250 MB.
          key: cgu-mensais-${{ github.run_id }}
          restore-keys: |
            cgu-mensais-
      - run: scripts/update.sh --fast
        env:
          ATLAS_LIMITE: "900"
          ATLAS_ORCAMENTO: "12600"
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sem o segredo, a variável chega vazia, o porteiro de relevância avisa no log e os artigos
          # ficam sem veredito — exatamente o comportamento de hoje, nada quebra. Com o segredo, o job
          # classifica sozinho e ninguém precisa rodar --porteiro-acervo à mão.
          EIKOS_KEY: ${{ secrets.EIKOS_KEY }}
          SITE_BASE: https://atlasdarepublica.org
          SITE_CNAME: atlasdarepublica.org
      - name: Commit dados gerados
        run: |
          # O job leva de uma a duas horas. Qualquer commit em main nesse intervalo fazia o push ser
          # rejeitado e o dia inteiro de coleta ia embora sem publicar. Agora ele se reconcilia com o
          # que chegou: rebase da sua única commit por cima de origin/main, com os arquivos gerados
          # ganhando o conflito, porque são o resultado fresco desta execução.
          git config user.name "atlas-bot" && git config user.email "bot@users.noreply.github.com"
          # README.md também é gerado: scripts/build_graph.py reescreve a tabela de cobertura dele.
          # Fora do add, ele ficava como alteração solta e o rebase se recusava a rodar.
          git add data/generated assets/img web/graph.br.js README.md
          git commit -m "dados: atualização automática $(date -u +%F)" || { echo "sem mudanças"; exit 0; }
          for tentativa in 1 2 3; do
            git fetch -q origin main
            # --autostash guarda qualquer outra alteração solta que um conector tenha deixado,
            # para o rebase nunca ser recusado por causa de arquivo fora do add.
            if git rebase --autostash -X theirs origin/main; then
              git push && exit 0
            else
              git rebase --abort || true
            fi
            echo "push rejeitado ou rebase falhou; tentativa $tentativa"
            sleep $((tentativa * 15))
          done
          echo "não consegui publicar os dados depois de 3 tentativas"; exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
