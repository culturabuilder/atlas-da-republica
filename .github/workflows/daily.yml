name: Atualização diária
on:
  schedule: [{ cron: "30 9 * * *" }]   # 06:30 em Brasília
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install pyyaml pillow
      - run: scripts/update.sh --fast
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
          SITE_BASE: https://atlasdarepublica.org
          SITE_CNAME: atlasdarepublica.org
      - name: Commit dados gerados
        run: |
          git config user.name "atlas-bot" && git config user.email "bot@users.noreply.github.com"
          git add data/generated assets/img web/graph.br.js
          git commit -m "dados: atualização automática $(date -u +%F)" || echo "sem mudanças"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
