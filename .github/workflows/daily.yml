name: Atualização diária
on:
  schedule: [{ cron: "30 9 * * *" }]   # 06:30 em Brasília
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: atualizacao-diaria, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    # teto duro: o orçamento interno de scripts/update.sh (3h30) deve terminar bem antes disto.
    # Se bater aqui, o job morre sem publicar — é o sintoma de que algum conector passou do limite.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install pyyaml pillow anthropic
      - run: scripts/update.sh --fast
        env:
          ATLAS_LIMITE: "900"
          ATLAS_ORCAMENTO: "12600"
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_BASE: https://atlasdarepublica.org
          SITE_CNAME: atlasdarepublica.org
      - name: Commit dados gerados
        run: |
          git config user.name "atlas-bot" && git config user.email "bot@users.noreply.github.com"
          git add data/generated assets/img web/graph.br.js
          git commit -m "dados: atualização automática $(date -u +%F)" || echo "sem mudanças"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
