<meta charset="utf-8">
<title>Atlas da República</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EFF0EB; --panel:#FAFAF7; --card:#FFFFFF; --ink:#1A1C19; --ink-2:#4B4F49; --ink-3:#7D817A; --line:#D8DBD3; --line-2:#E8EAE4;
  --accent:#1F5F4A; --accent-soft:#DDEBE3; --focus:#1F5F4A;
  --leg:#B8452E; --exe:#3B4C9B; --jud:#8A6C10; --ess:#5E3D7A; --povo:#C25A12;
  --sector-alpha:.10; --ring-alpha:.35; --node-fill:#FAFAF7;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131412; --panel:#1A1C19; --card:#20231F; --ink:#ECEDE8; --ink-2:#BDC0B8; --ink-3:#868A82; --line:#33362F; --line-2:#2A2D27;
  --accent:#8CCBAF; --accent-soft:#1E3A2E; --focus:#8CCBAF;
  --leg:#F0907A; --exe:#9AA6EE; --jud:#E2C25A; --ess:#C9A3E6; --povo:#F2A063;
  --sector-alpha:.14; --ring-alpha:.4; --node-fill:#1A1C19;
}}
:root[data-theme="dark"]{
  --bg:#131412; --panel:#1A1C19; --card:#20231F; --ink:#ECEDE8; --ink-2:#BDC0B8; --ink-3:#868A82; --line:#33362F; --line-2:#2A2D27;
  --accent:#8CCBAF; --accent-soft:#1E3A2E; --focus:#8CCBAF;
  --leg:#F0907A; --exe:#9AA6EE; --jud:#E2C25A; --ess:#C9A3E6; --povo:#F2A063;
  --sector-alpha:.14; --ring-alpha:.4; --node-fill:#1A1C19;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:minmax(360px,440px) 1fr;min-height:100vh}
/* ---------- painel ---------- */
.panel{padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:18px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:17px}
.brand .mark{width:20px;height:20px;border-radius:50%;background:var(--povo);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--povo)}
.brand .crumb{color:var(--ink-3);font-weight:500}
.brand .crumb a{color:var(--ink-3);text-decoration:none}
.brand .crumb a:hover{color:var(--ink)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.search input:focus{outline:2px solid var(--focus);outline-offset:1px}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--ink-3)}
.results{position:absolute;left:0;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:10;max-height:360px;overflow:auto;padding:6px}
.results[hidden]{display:none}
.results a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:15px}
.results a:hover,.results a:focus{background:var(--accent-soft);outline:none}
.results .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
h1{font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 8px;text-wrap:balance}
h2{font-family:var(--disp);font-size:15px;font-weight:700;margin:0 0 10px}
h3{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:16px 0 6px}
p{margin:8px 0;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.chip.sec{border-color:transparent;color:#fff}
.chip.warn{background:transparent;border-color:var(--jud);color:var(--jud)}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.list{display:flex;flex-direction:column;gap:6px}
.list a{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;text-decoration:none;color:var(--ink);font-size:15px;background:var(--panel)}
.list a:hover{border-color:var(--accent)}
.list a .sm{color:var(--ink-3);font-size:13px;margin-left:auto;white-space:nowrap}
.seat{padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:14px;color:var(--ink-3);font-style:italic}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px}
.stat .n{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.counts{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14.5px}
.counts span:nth-child(even){font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.counts .k{display:flex;align-items:center;gap:8px}
.rel{margin-top:4px}
.rel summary{cursor:pointer;font-size:14.5px;padding:6px 0;display:flex;gap:8px;align-items:center}
.rel summary .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-left:auto}
.rel .list{margin:4px 0 8px}
.cite{font-size:13.5px;color:var(--ink-3)}
.cite a{color:var(--ink-2)}
.foot{font-size:13px;color:var(--ink-3);padding:4px 6px}
/* ---------- gráfico ---------- */
.stage{position:relative;padding:12px}
.topbar{position:absolute;top:22px;right:22px;display:flex;gap:8px;z-index:5}
.btn{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.legend{position:absolute;left:22px;bottom:22px;z-index:5}
.legend .box{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.legend .box[hidden]{display:none}
.legend .box h3{grid-column:1/-1;margin:6px 0 2px}
.legend .box div{display:flex;align-items:center;gap:8px}
.legend svg{width:22px;height:14px;flex:none;color:var(--ink)}
svg.wheel{width:100%;max-width:min(96vh,980px);height:auto;display:block;margin:0 auto;font-family:var(--mono)}
.sector-bg{fill-opacity:var(--sector-alpha);stroke:var(--ink);stroke-opacity:.12}
.ring{fill:none;stroke:var(--ink);stroke-opacity:var(--ring-alpha);stroke-dasharray:2 5}
.ring-label{font-size:8.5px;letter-spacing:.2em;fill:var(--ink);fill-opacity:.55}
.sector-label{font-size:11px;letter-spacing:.28em;font-weight:600}
.node{cursor:pointer}
.node .shape{fill:var(--node-fill);stroke-width:1.4;transition:opacity .15s}
.node.pos .shape{stroke-width:1;fill-opacity:.9}
.node:hover .shape,.node:focus .shape{stroke-width:2.6}
.node:focus{outline:none}
.node:focus-visible .shape{stroke-width:3;stroke:var(--focus)}
.node.sel .shape{fill:currentColor;stroke:currentColor;stroke-width:2}
.dim .node:not(.sel):not(.lit) .shape{opacity:.25}
.dim .node:not(.sel):not(.lit) text{opacity:.2}
.edge{fill:none;stroke-width:1.3;pointer-events:none}
.edge.nomeia,.edge.chefia{stroke-dasharray:none}
.edge.sabatina,.edge.indica{stroke-dasharray:5 3}
.edge.integra,.edge.membro_nato{stroke-dasharray:1.5 3}
.edge.supervisiona,.edge.fiscaliza,.edge.aconselha{stroke-dasharray:8 3 2 3}
.edge.elege{stroke-width:2.4}
.center-label{font-family:var(--disp);font-weight:700;font-size:9.5px;fill:#fff;text-anchor:middle}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:5px 9px;border-radius:5px;white-space:nowrap;z-index:6;transform:translate(-50%,-140%)}
.tip[hidden]{display:none}
.tip small{opacity:.7;font-family:var(--mono);font-size:10px;margin-left:6px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .panel{max-height:none;position:static;order:2}
  .stage{order:1}
  .topbar{top:16px;right:16px}
  .legend{position:static;margin-top:8px}
  .legend .box{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div class="app">
  <aside class="panel" id="panel">
    <div class="card" style="padding:12px 16px">
      <div class="brand"><span class="mark"></span><span>Atlas da República</span><span class="crumb">/ <a href="#">Governo federal</a></span></div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar órgão, cargo ou sigla (MF, STF, Anatel…)" autocomplete="off" aria-label="Buscar no grafo" role="combobox" aria-expanded="false" aria-controls="results">
      <div id="results" class="results" role="listbox" hidden></div>
    </div>
    <div id="content"></div>
    <div class="foot">Fase 0 · dados curados à mão com citação legal · ocupantes chegam com a ETL da Fase 1</div>
  </aside>
  <main class="stage" id="stage">
    <div class="topbar">
      <button class="btn" id="theme" aria-label="Alternar tema claro e escuro">◐ Tema</button>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div id="graph"></div>
    <div class="legend">
      <button class="btn" id="legend-btn" aria-expanded="false" aria-controls="legend-box">Legenda ▾</button>
      <div class="box" id="legend-box" hidden></div>
    </div>
  </main>
</div>

<script src="graph.br.js"></script>
<script>
(function(){
const G = window.ATLAS; const N = G.nodes, E = G.edges, L = G.layout;
const SEC = {}; L.sectors.forEach(s => SEC[s.id] = s);
const COL = {legislativo:'var(--leg)', executivo:'var(--exe)', judiciario:'var(--jud)', essenciais:'var(--ess)'};
const TYPE_NAME = {constituency:'Eleitorado', elected:'Órgão eletivo', department:'Órgão', dept_head:'Cargo', commission:'Colegiado', advisory:'Conselho consultivo'};
const SUB = {orgao_presidencia:'Órgão da Presidência', ministerio:'Ministério', orgao_singular:'Órgão singular', autarquia:'Autarquia', agencia_reguladora:'Agência reguladora', fundacao:'Fundação pública', empresa_publica:'Empresa pública', sociedade_economia_mista:'Sociedade de economia mista', forca_armada:'Força Armada', tribunal:'Tribunal', casa_legislativa:'Casa legislativa', ministerio_publico:'Ministério Público', defensoria:'Defensoria', advocacia:'Advocacia pública', chefia_executivo:'Chefia do Executivo'};
const REL = {elege:['Elege','Eleito por'], nomeia:['Nomeia','Nomeado por'], sabatina:['Sabatina e aprova','Sabatinado por'], fiscaliza:['Fiscaliza','Fiscalizado por'], supervisiona:['Supervisiona','Supervisionado por'], aconselha:['Aconselha','Aconselhado por'], chefia:['Chefia','Chefiado por'], membro_nato:['Membro nato de','Tem como membro nato'], integra:['Integra','Integrado por'], indica:['Indica','Indicado por']};

// ---------- layout radial ----------
const W = 920, C = W/2;
const RING_R = {0:0, 1:118, 2:205, 3:292, 4:378};
const R_IN = 78, R_OUT = 415;
// setores: [início, fim] em graus, 0 = topo, sentido horário
const ARC = {legislativo:[-36,36], executivo:[36,222], judiciario:[222,282], essenciais:[282,324]};
const rad = d => (d-90)*Math.PI/180;
const pt = (deg, r) => [C + r*Math.cos(rad(deg)), C + r*Math.sin(rad(deg))];
function arcPath(a0,a1,r0,r1){ const [x0,y0]=pt(a0,r1),[x1,y1]=pt(a1,r1),[x2,y2]=pt(a1,r0),[x3,y3]=pt(a0,r0); const big=(a1-a0)>180?1:0; return `M${x0},${y0} A${r1},${r1} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r0},${r0} 0 ${big} 0 ${x3},${y3} Z`; }
function ringArc(a0,a1,r){ const [x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r); const big=(a1-a0)>180?1:0; return `M${x0},${y0} A${r},${r} 0 ${big} 1 ${x1},${y1}`; }

const orgs = Object.values(N).filter(n => n.type !== 'dept_head' && n.type !== 'constituency');
const angle = {};
for (const sid of Object.keys(ARC)) {
  const [a0,a1] = ARC[sid]; const pad = 5;
  for (const ring of [1,2,3,4]) {
    let list = orgs.filter(n => n.sector === sid && n.ring === ring);
    if (!list.length) continue;
    // ordena pelo ângulo do parent (agrupa filhos) e depois por nome
    list.sort((a,b) => {
      const pa = a.parent && angle[a.parent] != null ? angle[a.parent] : 999, pb = b.parent && angle[b.parent] != null ? angle[b.parent] : 999;
      return pa - pb || a.name.localeCompare(b.name,'pt');
    });
    const span = (a1-a0) - 2*pad; const step = list.length > 1 ? span/(list.length-1) : 0;
    list.forEach((n,i) => angle[n.id] = list.length > 1 ? a0+pad+i*step : (a0+a1)/2);
  }
}
// cargos: mesmo ângulo do órgão, um pouco para dentro; vários cargos do mesmo órgão se espalham
const posOf = {};
for (const n of orgs) {
  const ps = n.positions || []; ps.forEach((pid,i) => { const off = (i-(ps.length-1)/2)*2.4; posOf[pid] = {a: angle[n.id]+off, r: RING_R[n.ring]-17}; });
}
function xy(id){ const n=N[id]; if(n.type==='constituency') return [C,C]; if(n.type==='dept_head'){ const p=posOf[id]; return pt(p.a,p.r);} return pt(angle[id], RING_R[n.ring]); }

// ---------- desenho ----------
function shape(n, s){
  const t=n.type, k=(n.ring===1||n.ring===2)?1.25:1; s=s*k;
  if (t==='elected') return `<circle class="shape" r="${s}"/>`;
  if (t==='department') { const sub=n.subtype; if(sub==='tribunal') return `<polygon class="shape" points="${poly(5,s+1,-90)}"/>`; if(sub==='forca_armada') return `<polygon class="shape" points="${poly(3,s+2,-90)}"/>`; return `<rect class="shape" x="${-s}" y="${-s}" width="${2*s}" height="${2*s}" rx="1.5"/>`; }
  if (t==='commission') return `<polygon class="shape" points="${poly(5,s+1,-90)}" transform="rotate(180)"/>`;
  if (t==='advisory') return `<polygon class="shape" points="${poly(6,s+1,0)}"/>`;
  if (t==='dept_head') return `<circle class="shape" r="2.6"/>`;
  return '';
}
function poly(nn,r,rot){ const o=[]; for(let i=0;i<nn;i++){ const a=(rot+i*360/nn)*Math.PI/180; o.push((r*Math.cos(a)).toFixed(1)+','+(r*Math.sin(a)).toFixed(1)); } return o.join(' '); }
function burst(r){ const o=[]; for(let i=0;i<32;i++){ const a=i*Math.PI/16, rr=i%2?r:r*0.88; o.push((C+rr*Math.cos(a)).toFixed(1)+','+(C+rr*Math.sin(a)).toFixed(1)); } return o.join(' '); }

function draw(){
  let s = `<svg class="wheel" viewBox="0 0 ${W} ${W}" role="group" aria-label="Roda do governo federal: ${G.stats.nodes} nós em quatro setores">
  <defs>${Object.keys(REL).map(t=>`<marker id="m-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>`).join('')}</defs>`;
  for (const sid of Object.keys(ARC)) { const [a0,a1]=ARC[sid]; s += `<path class="sector-bg" d="${arcPath(a0,a1,R_IN,R_OUT)}" fill="${COL[sid]}"/>`; }
  for (const r of [1,2,3,4]) s += `<circle class="ring" cx="${C}" cy="${C}" r="${RING_R[r]}"/>`;
  // rótulos de anel na fatia executiva, ao longo do arco
  for (const r of [1,2,3,4]) { s += `<path id="rl${r}" d="${ringArcRev(150,210,RING_R[r]-9)}" fill="none"/><text class="ring-label"><textPath href="#rl${r}" startOffset="50%" text-anchor="middle">${L.rings[r].name.toUpperCase()}</textPath></text>`; }
  for (const sid of Object.keys(ARC)) { const [a0,a1]=ARC[sid]; const flip = (a0+a1)/2 > 90 && (a0+a1)/2 < 270; const d = flip ? ringArc(a1,a0,R_OUT+9).replace('0 0 1','0 0 0') : ringArc(a0,a1,R_OUT+12); const lbl=(SEC[sid].short||SEC[sid].name).toUpperCase();
    s += `<path id="sl-${sid}" d="${flip?ringArcRev(a0,a1,R_OUT+6):ringArc(a0,a1,R_OUT+13)}" fill="none"/><text class="sector-label" fill="${COL[sid]}"><textPath href="#sl-${sid}" startOffset="50%" text-anchor="middle">${lbl}</textPath></text>`; }
  s += `<g id="edges"></g>`;
  s += `<a class="node center" href="#br-eleitorado" data-id="br-eleitorado" aria-label="Povo brasileiro, eleitorado"><polygon class="shape" points="${burst(52)}" style="fill:var(--povo);stroke:var(--povo)"/><text class="center-label" x="${C}" y="${C-3}">Povo</text><text class="center-label" x="${C}" y="${C+9}">brasileiro</text></a>`;
  for (const n of orgs) { const [x,y]=xy(n.id); s += `<a class="node" href="#${n.id}" data-id="${n.id}" aria-label="${esc(n.name)}, ${TYPE_NAME[n.type]}" style="color:${COL[n.sector]}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><g style="stroke:${COL[n.sector]}">${shape(n, n.ring<=2?6:4.6)}</g></a>`; }
  for (const n of Object.values(N)) if (n.type==='dept_head') { const [x,y]=xy(n.id); s += `<a class="node pos" href="#${n.id}" data-id="${n.id}" aria-label="${esc(n.name)}, cargo" style="color:${COL[n.sector]}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><g style="stroke:${COL[n.sector]}">${shape(n,0)}</g></a>`; }
  s += `</svg>`;
  document.getElementById('graph').innerHTML = s;
}
function ringArcRev(a0,a1,r){ const [x0,y0]=pt(a1,r),[x1,y1]=pt(a0,r); const big=(a1-a0)>180?1:0; return `M${x0},${y0} A${r},${r} 0 ${big} 0 ${x1},${y1}`; }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ---------- seleção ----------
let current = null;
function select(id){
  current = N[id] ? id : null;
  const svg = document.querySelector('svg.wheel'); const eg = document.getElementById('edges');
  document.querySelectorAll('.node').forEach(a => { a.classList.remove('sel','lit'); });
  eg.innerHTML = '';
  if (!current) { svg.classList.remove('dim'); renderHome(); return; }
  svg.classList.add('dim');
  const n = N[current]; const me = document.querySelector(`.node[data-id="${current}"]`); if (me) me.classList.add('sel');
  let lines = '';
  for (const eid of n.edges) { const e = E[eid]; const other = e.from === current ? e.to : e.from; const o = document.querySelector(`.node[data-id="${other}"]`); if (o) o.classList.add('lit');
    const [x1,y1] = xy(e.from), [x2,y2] = xy(e.to); const col = COL[N[e.from].sector] || 'var(--povo)';
    lines += `<path class="edge ${e.type}" d="${curve(x1,y1,x2,y2)}" stroke="${col}" marker-end="url(#m-${e.type})"/>`; }
  eg.innerHTML = lines;
  renderNode(n);
}
function curve(x1,y1,x2,y2){ const mx=(x1+x2)/2, my=(y1+y2)/2; const dx=x2-x1, dy=y2-y1; const k=0.12; const cx=mx-dy*k, cy=my+dx*k; return `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`; }

// ---------- painel ----------
const content = document.getElementById('content');
function sectorChip(sid){ return sid ? `<span class="chip sec" style="background:${COL[sid]}">${SEC[sid].name}</span>` : ''; }
function link(id, extra){ const n=N[id]; return `<a href="#${id}"><span class="dot" style="background:${COL[n.sector]||'var(--povo)'}"></span><span>${esc(n.name)}</span>${extra?`<span class="sm">${extra}</span>`:''}</a>`; }
function renderHome(){
  const st = G.stats; const bt = st.by_type, bs = st.by_sector, bsub = st.by_subtype;
  const subRows = [['ministerio','Ministérios'],['orgao_presidencia','Órgãos da Presidência'],['agencia_reguladora','Agências reguladoras'],['autarquia','Autarquias'],['fundacao','Fundações'],['empresa_publica','Empresas públicas'],['sociedade_economia_mista','Sociedades de economia mista'],['tribunal','Tribunais'],['ministerio_publico','Ministério Público'],['forca_armada','Forças Armadas']];
  content.innerHTML = `
  <div class="card"><h1>Quem manda em quê no governo federal</h1>
    <p>Um mapa de cada órgão, cargo e colegiado da União e das relações legais entre eles: quem elege, nomeia, sabatina, supervisiona e fiscaliza quem. Cada ligação cita a norma que a cria.</p>
    <div class="stats"><div class="stat"><div class="n">${st.nodes}</div><div class="l">nós</div></div><div class="stat"><div class="n">${st.edges}</div><div class="l">relações</div></div><div class="stat"><div class="n">${st.seats_sabatina}</div><div class="l">cadeiras sabatinadas</div></div></div>
    <p style="font-size:14px">Clique em um nó da roda ou busque por sigla. A distância do centro mostra quantos passos separam o eleitor do órgão.</p></div>
  <div class="card"><h2>Por poder</h2><div class="counts">${Object.keys(ARC).map(s=>`<span class="k"><span class="dot" style="background:${COL[s]}"></span>${SEC[s].name}</span><span>${bs[s]||0}</span>`).join('')}</div>
    <h3>Por tipo de órgão</h3><div class="counts">${subRows.map(([k,l])=>`<span>${l}</span><span>${bsub[k]||0}</span>`).join('')}</div>
    <h3>Cargos e colegiados</h3><div class="counts"><span>Cargos de chefia mapeados</span><span>${bt.dept_head||0}</span><span>Cadeiras (inclui 513 deputados e 81 senadores)</span><span>${st.seats_total}</span><span>Colegiados deliberativos</span><span>${bt.commission||0}</span><span>Conselhos consultivos</span><span>${bt.advisory||0}</span></div></div>
  <div class="card"><h2>Como ler a roda</h2><div class="counts">${[1,2,3,4].map(r=>`<span><b>Anel ${r} · ${L.rings[r].name}</b><br><span style="color:var(--ink-3);font-size:13.5px">${L.rings[r].description}</span></span><span></span>`).join('')}</div>
    <p style="font-size:13.5px;margin-top:10px">${st.unverified} citações ainda marcadas para conferência. Gerado em ${st.generated_at}.</p></div>`;
}
function renderNode(n){
  const isPos = n.type==='dept_head';
  const groups = {};
  for (const eid of n.edges) { const e=E[eid]; const out = e.from===n.id; const key = e.type+(out?':out':':in'); (groups[key] = groups[key]||[]).push(e); }
  const order = ['chefia','elege','nomeia','sabatina','indica','supervisiona','integra','fiscaliza','aconselha','membro_nato'];
  let rels = '';
  for (const t of order) for (const dir of [':out',':in']) { const list = groups[t+dir]; if(!list) continue; const label = REL[t][dir===':out'?0:1];
    rels += `<details class="rel" open><summary><span class="dot" style="background:var(--ink-3)"></span>${label}<span class="n">${list.length}</span></summary><div class="list">${list.map(e=>{ const o = e.from===n.id?e.to:e.from; const extra = (e.seats&&e.seats>1?`${e.seats} vagas · `:'')+e.cite.split(';')[0]; return link(o, esc(extra)); }).join('')}</div></details>`; }
  const head = n.head_of ? N[n.head_of] : null;
  const parent = n.parent ? N[n.parent] : null;
  const kids = (n.children||[]).map(id=>link(id, SUB[N[id].subtype]||'')).join('');
  const poss = (n.positions||[]).map(id=>{ const p=N[id]; return link(id, (p.seats>1?p.seats+' vagas':'') + (p.sabatina?' · sabatina':'')); }).join('');
  const seats = isPos ? `<h3>Ocupante${n.seats>1?'s':''}</h3><div class="seat">${n.seats>1?n.seats+' cadeiras. ':''}Sem dado de ocupante na Fase 0. A ETL do Portal da Transparência, da Câmara, do Senado e do DOU preenche este campo.</div>` : '';
  content.innerHTML = `<div class="card">
    <div class="chips">${sectorChip(n.sector)}<span class="chip">${TYPE_NAME[n.type]}${n.subtype?' · '+(SUB[n.subtype]||n.subtype):''}</span>${n.ring?`<span class="chip">Anel ${n.ring} · ${L.rings[n.ring].name}</span>`:''}${n.verified===false?'<span class="chip warn">citação a conferir</span>':''}</div>
    <h1>${esc(n.name)}</h1>
    ${n.aliases&&n.aliases.length?`<p style="margin-top:-4px;font-size:14px;color:var(--ink-3)">${n.aliases.map(esc).join(' · ')}</p>`:''}
    <p>${esc(n.description)}</p>
    <div class="links">${n.cite_url?`<a href="${n.cite_url}" target="_blank" rel="noopener">Fonte legal ↗</a>`:''}${n.official_url?`<a href="${n.official_url}" target="_blank" rel="noopener">Site oficial ↗</a>`:''}</div>
    <p class="cite">${esc(n.cite)}${n.mandato_anos?` · mandato de ${n.mandato_anos} anos`:''}</p>
    ${head?`<h3>Chefia</h3><div class="list">${link(head.id, SUB[head.subtype]||'')}</div>`:''}
    ${seats}
    ${parent?`<h3>${n.subtype&&['autarquia','fundacao','empresa_publica','sociedade_economia_mista','agencia_reguladora'].includes(n.subtype)?'Vinculado a':'Integra'}</h3><div class="list">${link(parent.id)}</div>`:''}
    ${poss?`<h3>Cargos</h3><div class="list">${poss}</div>`:''}
    ${kids?`<h3>Órgãos integrados e vinculados <span style="font-weight:400">· ${n.children.length}</span></h3><div class="list">${kids}</div>`:''}
  </div>
  <div class="card"><h2>Relações <span style="color:var(--ink-3);font-weight:500">· ${n.edges.length}</span></h2>${rels||'<p>Nenhuma relação registrada.</p>'}</div>`;
  document.getElementById('panel').scrollTo({top:0});
}

// ---------- busca ----------
const q = document.getElementById('q'), res = document.getElementById('results');
const norm = s => s.normalize('NFD').replace(/\p{M}/gu,'').toLowerCase();
const index = Object.values(N).map(n => ({id:n.id, name:n.name, type:n.type, sector:n.sector, hay: norm([n.name, ...(n.aliases||[])].join(' ')), al: norm((n.aliases||[]).join(' '))}));
q.addEventListener('input', () => {
  const v = norm(q.value.trim()); if (v.length < 2) { res.hidden = true; q.setAttribute('aria-expanded','false'); return; }
  const hits = index.map(x => { let sc = 0; if (x.al.split(' ').includes(v)) sc = 100; else if (x.hay.startsWith(v)) sc = 60; else if (x.hay.includes(' '+v)) sc = 40; else if (x.hay.includes(v)) sc = 20; if (x.type==='dept_head') sc -= 5; return {x, sc}; }).filter(h=>h.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,12);
  res.innerHTML = hits.length ? hits.map(h=>`<a href="#${h.x.id}" role="option"><span class="dot" style="background:${COL[h.x.sector]||'var(--povo)'}"></span><span>${esc(h.x.name)}</span><span class="t">${TYPE_NAME[h.x.type]}</span></a>`).join('') : '<div style="padding:10px;color:var(--ink-3)">Nada encontrado. Tente a sigla (MF, STF, Anatel).</div>';
  res.hidden = false; q.setAttribute('aria-expanded','true');
});
q.addEventListener('keydown', e => { if (e.key==='Enter') { const a = res.querySelector('a'); if (a) { location.hash = a.getAttribute('href'); } } if (e.key==='Escape') { res.hidden = true; q.value=''; } if (e.key==='ArrowDown') { const a=res.querySelector('a'); if(a){a.focus(); e.preventDefault();} } });
res.addEventListener('keydown', e => { const items=[...res.querySelectorAll('a')]; const i=items.indexOf(document.activeElement); if(e.key==='ArrowDown'&&items[i+1]){items[i+1].focus();e.preventDefault();} if(e.key==='ArrowUp'){ (items[i-1]||q).focus(); e.preventDefault(); } if(e.key==='Escape'){res.hidden=true;q.focus();} });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
window.addEventListener('hashchange', () => { res.hidden = true; q.value=''; select(location.hash.slice(1)); });

// ---------- tooltip, teclado ----------
const tip = document.getElementById('tip'), stage = document.getElementById('stage');
document.getElementById('graph').addEventListener('mousemove', e => { const a = e.target.closest('.node'); if (!a) { tip.hidden = true; return; } const n = N[a.dataset.id]; const r = stage.getBoundingClientRect(); tip.innerHTML = esc(n.name) + `<small>${TYPE_NAME[n.type]}</small>`; tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.hidden = false; });
document.getElementById('graph').addEventListener('mouseleave', () => tip.hidden = true);
document.addEventListener('keydown', e => { if (e.key==='Escape' && !q.value && document.activeElement !== q) { location.hash = ''; } if (e.key==='/' && document.activeElement !== q) { q.focus(); e.preventDefault(); } });

// ---------- legenda e tema ----------
const lb = document.getElementById('legend-btn'), lbox = document.getElementById('legend-box');
function legendSvg(t){ const dash = {elege:'',nomeia:'',chefia:'',sabatina:'5 3',indica:'5 3',integra:'1.5 3',membro_nato:'1.5 3',supervisiona:'8 3 2 3',fiscaliza:'8 3 2 3',aconselha:'8 3 2 3'}[t]; const w=t==='elege'?2.4:1.3; return `<svg viewBox="0 0 22 14"><path d="M1,7 H17" stroke="currentColor" stroke-width="${w}" stroke-dasharray="${dash}" fill="none"/><path d="M15,3 L21,7 L15,11 z" fill="currentColor"/></svg>`; }
const shapeSvg = {elected:'<svg viewBox="0 0 22 14"><circle cx="11" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>', department:'<svg viewBox="0 0 22 14"><rect x="6" y="2" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>', tribunal:'<svg viewBox="0 0 22 14"><polygon points="11,1 16.7,5.1 14.5,11.9 7.5,11.9 5.3,5.1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>', forca:'<svg viewBox="0 0 22 14"><polygon points="11,1 17,12 5,12" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>', commission:'<svg viewBox="0 0 22 14"><polygon points="11,13 5.3,8.9 7.5,2.1 14.5,2.1 16.7,8.9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>', advisory:'<svg viewBox="0 0 22 14"><polygon points="16,7 13.5,11.3 8.5,11.3 6,7 8.5,2.7 13.5,2.7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>', dept_head:'<svg viewBox="0 0 22 14"><circle cx="11" cy="7" r="2.6" fill="currentColor"/></svg>'};
lbox.innerHTML = `<h3>Entidades</h3><div>${shapeSvg.elected} Órgão eletivo</div><div>${shapeSvg.department} Órgão, autarquia, empresa</div><div>${shapeSvg.tribunal} Tribunal</div><div>${shapeSvg.forca} Força Armada</div><div>${shapeSvg.commission} Colegiado deliberativo</div><div>${shapeSvg.advisory} Conselho consultivo</div><div>${shapeSvg.dept_head} Cargo de chefia</div><div></div>
  <h3>Relações</h3>${Object.keys(REL).map(t=>`<div>${legendSvg(t)} ${REL[t][0]}</div>`).join('')}
  <h3>Setores</h3>${Object.keys(ARC).map(s=>`<div><span class="dot" style="background:${COL[s]}"></span>${SEC[s].name}</div>`).join('')}`;
lb.addEventListener('click', () => { const open = lbox.hidden; lbox.hidden = !open; lb.setAttribute('aria-expanded', String(open)); lb.textContent = open ? 'Legenda ▴' : 'Legenda ▾'; });
const root = document.documentElement, tb = document.getElementById('theme');
try { const saved = localStorage.getItem('atlas-theme'); if (saved) root.dataset.theme = saved; } catch(e){}
tb.addEventListener('click', () => { const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('atlas-theme', root.dataset.theme); } catch(e){} });

draw();
select(location.hash.slice(1));
})();
</script>
