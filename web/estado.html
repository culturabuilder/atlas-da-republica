<meta charset="utf-8">

<title>__TITULO__</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>
<link rel="stylesheet" href="__PREFIX__/atlas.css">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
a{color:var(--accent)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:9}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2)}
.bar .brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bar .brand .mark{width:16px;height:16px;border-radius:50%;background:var(--povo);box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--povo)}
.bar .crumb{color:var(--ink-3);font-weight:500}
.bar .sp{flex:1}
.btn{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
main{max-width:820px;margin:0 auto;padding:24px 20px 100px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--disp);font-size:clamp(32px,5vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.04;margin:10px 0 14px;text-wrap:balance}
p.lead{font-size:19px;color:var(--ink-2);max-width:60ch;margin:0 0 18px}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:22px}
.toc{margin:0 0 30px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2px 20px}
.toc a{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);font-size:15px;padding:5px 0;border-bottom:1px dashed var(--line-2)}
.toc a b{font-family:var(--mono);font-weight:600;font-size:11px;color:var(--ink-3)}
.toc a:hover{color:var(--accent)}
section{padding-top:44px;scroll-margin-top:60px}
h2{font-family:var(--disp);font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.015em;line-height:1.1;margin:6px 0 10px}
h3{font-family:var(--disp);font-size:17px;font-weight:700;margin:22px 0 6px}
p{margin:0 0 12px;max-width:66ch}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:14px 0 16px;padding:14px 16px;background:var(--card);border:1px solid var(--line-2);border-radius:10px;font-size:15.5px}
dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
dd{margin:0}
ul,ol{padding-left:22px;max-width:66ch} li{margin:5px 0}
code{font-family:var(--mono);font-size:14px;background:var(--card);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2)}
.note{border-left:3px solid var(--accent);padding:8px 14px;margin:14px 0;color:var(--ink-2);background:var(--accent-soft);border-radius:0 8px 8px 0}
.foot{margin-top:50px;padding-top:16px;border-top:1px solid var(--line-2);font-size:14px;color:var(--ink-3)}
@media (max-width:600px){ .bar .crumb{display:none} dl{grid-template-columns:1fr;gap:2px 0} dt{margin-top:8px} }
.fresh{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:18px 0}
.fresh h2{font-size:16px;margin:0 0 4px}
.fresh p{font-size:13.5px;color:var(--ink-2);margin:0 0 10px}
.fresh .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 16px}
.fresh .it{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;border-bottom:1px solid var(--line-2)}
.fresh .it b{font-weight:600}
.fresh .it span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.fresh .it.old span{color:var(--warn,#9A5B00);font-weight:600}
.fresh .it.miss span{color:var(--leg,#B8452E)}
</style>

<a href="#estrutura" class="skip">Pular para o conteúdo</a>
<div class="bar">
  <a class="brand" href="__PREFIX__/"><span class="mark"></span>Atlas da República <span class="crumb">/ __CRUMB__</span></a>
  <span class="sp"></span>
  <a class="btn" href="__PREFIX__/dados/">Dados</a>
  <button class="btn" id="theme" aria-label="Alternar tema claro e escuro">◐ Tema</button>
</div>
<style>
.tbl{overflow-x:auto;margin:14px 0}
.tbl table{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:left}
.tbl thead th{border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-3);font-weight:600}
.stats .stat{border:1px solid var(--line);border-radius:10px;padding:12px}
.stats .stat .n{font-family:var(--mono);font-size:24px;line-height:1.1}
.stats .stat .l{font-size:13px;color:var(--ink-2);margin-top:4px}
ul{line-height:1.6}
.note{font-size:13.5px;color:var(--ink-3)}
.ufs{display:flex;flex-wrap:wrap;gap:6px;margin:28px 0 0}
.ufs a{font-family:var(--mono);font-size:12.5px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;text-decoration:none}
@media (max-width:560px){ul[style*=columns]{columns:1 !important}}
</style>
